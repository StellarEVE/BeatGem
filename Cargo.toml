[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/audio",
    "crates/platform",
    "crates/media",
    "crates/render",
    "crates/engine",
    "crates/app",
    "crates/cli",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
authors = ["BeatGem Contributors"]
description = "Structural, beat-synced desktop video editor written in Rust and WGSL."
repository = "https://github.com/beatgem/beatgem"

[workspace.dependencies]
beatgem-core = { path = "crates/core" }
beatgem-audio = { path = "crates/audio" }
beatgem-platform = { path = "crates/platform" }
beatgem-media = { path = "crates/media" }
beatgem-render = { path = "crates/render" }
beatgem-engine = { path = "crates/engine" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
blake3 = "1.5"
symphonia = { version = "0.5", features = ["all"] }
rustfft = "6.2"
wgpu = "22.1"
pollster = "0.4"
bytemuck = { version = "1.18", features = ["derive"] }
crossbeam-channel = "0.5"
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["wgpu", "glow", "default_fonts"] }
clap = { version = "4.5", features = ["derive"] }
