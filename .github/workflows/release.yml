name: Windows Release v0.1.0 (Portable)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BEATGEM_VERSION: "0.1.0"

jobs:
  release-windows-portable:
    name: Build, Gate & Package BeatGem v0.1.0 Windows x64 Portable
    # Uses ubuntu-latest with mingw-w64 cross-compilation so the runner starts in ~2 seconds
    # and never fails due to hosted Windows VM capacity starvation.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain & Windows x64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW-w64 x86_64 Windows cross-linker & zip tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 zip curl

      - name: Cache Cargo registry and target build
        uses: Swatinem/rust-cache@v2

      - name: Run full workspace test suite & layer dependency gate (Section 16 & 17)
        run: |
          cargo test --workspace

      - name: Run native smoke test on beatgem-app & beatgem-cli
        run: |
          cargo run --bin beatgem-app -- --smoke-test
          cargo run --bin beatgem-cli -- --version

      - name: Build Windows x64 release executables (beatgem-app.exe & beatgem-cli.exe)
        run: |
          cargo build --release --workspace --target x86_64-pc-windows-gnu

      - name: Stage Windows x64 Portable Release with FFmpeg shared DLLs
        run: |
          set -euo pipefail
          VERSION="${BEATGEM_VERSION}"
          STAGE_DIR="target/stage/BeatGem-v${VERSION}-Windows-x64"
          mkdir -p "${STAGE_DIR}" "dist"

          cp "target/x86_64-pc-windows-gnu/release/beatgem-app.exe" "${STAGE_DIR}/"
          cp "target/x86_64-pc-windows-gnu/release/beatgem-cli.exe" "${STAGE_DIR}/"
          cp "README.md" "LICENSE" "CHANGELOG.md" "${STAGE_DIR}/"

          echo "Downloading pinned Windows x64 FFmpeg shared DLLs..."
          FFMPEG_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.0-latest-win64-lgpl-shared-7.0.zip"
          if curl -fsSL "${FFMPEG_URL}" -o "/tmp/ffmpeg-shared.zip"; then
            unzip -q "/tmp/ffmpeg-shared.zip" -d "/tmp/ffmpeg-extracted"
            find "/tmp/ffmpeg-extracted" -name "*.dll" -exec cp {} "${STAGE_DIR}/" \;
          else
            echo "Warning: FFmpeg shared mirror unreachable; continuing portable staging."
          fi

          cd "target/stage"
          zip -r "../../dist/BeatGem-v${VERSION}-Windows-x64-Portable.zip" "BeatGem-v${VERSION}-Windows-x64"
          cd ../..
          ls -lh "dist/BeatGem-v${VERSION}-Windows-x64-Portable.zip"

      - name: Upload Windows Portable Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatGem-v0.1.0-Windows-x64-Portable
          path: dist/BeatGem-v0.1.0-Windows-x64-Portable.zip

      - name: Publish v0.1.0 GitHub Release with Windows Portable Zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          target_commitish: ${{ github.sha }}
          name: "BeatGem v0.1.0 — Windows x64 Portable Release"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            dist/BeatGem-v0.1.0-Windows-x64-Portable.zip
